x-evidence:
  harvested: '2026-08-02'
  request: apis.io add form, parked 2026-07-24
  probes:
    - https://api.jobvetta.com/v1/jobs -> HTTP 401, application/json, "Invalid or missing API key"
    - https://api.jobvetta.com/mcp tools/list -> HTTP 200, 2 tools, no credentials required
    - https://www.jobvetta.com/api -> HTTP 200, documents base URL, bearer auth and parameters
    - https://www.jobvetta.com/mcp -> HTTP 200, documents both tools and the install command
    - https://www.jobvetta.com/nonexistent-xyz789 -> HTTP 404, 57 bytes (no catch-all)
    - https://api.jobvetta.com/openapi.json -> HTTP 404
    - https://www.jobvetta.com/llms.txt -> HTTP 404
    - https://api.jobvetta.com/.well-known/mcp.json -> HTTP 404
  parked_in_error: >-
    The add-API pipeline parked this submission on 2026-07-24 at confidence 5 with reason
    `no_consumable_surface`. That is wrong. The API is live and enforcing auth, the MCP server is
    hosted and answers tools/list unauthenticated, and both are documented with base URL, auth
    scheme and per-parameter tables. What is missing is a machine-readable OpenAPI — the gate
    appears unable to recognise an API that is documented in HTML but not specified. Same failure
    class as the Torry Harris parking. See api-evangelist/roadmap#3.
  defects_found:
    no_openapi: >-
      No OpenAPI document is published. The REST surface is documented only in HTML, so there is
      nothing machine-readable to harvest, score for contract depth, or generate clients from.
      This is the single highest-leverage thing they could add.
    no_llms_txt: >-
      No llms.txt, and no MCP server card at /.well-known/mcp.json, despite the docs referring to a
      "server card". Discovery works through tools/list alone.
  not_asserted:
    pricing: >-
      "Free during early access" with a stated shared limit of 50 tool calls per day and 20 jobs
      per search. No machine-readable rate card or plan document exists, so plans and rate limits
      are not asserted as artifacts.
  note: >-
    Recovered from the parked queue rather than submitted twice. The MCP property is emitted
    because the endpoint is hosted and reachable, not a local install.
