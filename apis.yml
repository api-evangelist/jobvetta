name: Jobvetta
description: >-
  Jobvetta is a jobs API for India — live openings gathered and checked against official employer
  sources, exposed as a REST API and a hosted MCP server that share one key. Search by keyword,
  Indian city or state, and posting age; fetch full structured detail for a single job. It is
  India-only by design: non-Indian locations return no results. The MCP server answers tools/list
  without credentials, so an agent can discover the two tools before signing up, and installation
  is a single documented `claude mcp add` command. Free during early access, with a shared limit of
  50 tool calls per day and up to 20 jobs per search across both surfaces.
url: https://raw.githubusercontent.com/api-evangelist/jobvetta/refs/heads/main/apis.yml
created: '2026-08-02'
modified: '2026-08-02'
specificationVersion: '0.21'
tags:
  - Jobs
  - Recruitment
  - Job Search
  - India
  - Employment
  - MCP
  - Agent-native
  - Developer Tools
apis:
  - name: Jobvetta REST API
    description: >-
      REST access to live, vetted India job openings. `GET /jobs` searches by keyword (`q`), Indian
      city or state (`location`), posting age in days (`days`, 1–365) and result count (`limit`,
      1–20, default 10); a companion call returns full structured detail for one job. Authenticates
      with a bearer token in the Authorization header. Verified live — an unauthenticated call
      returns HTTP 401 with a JSON error pointing at the dashboard.
    humanURL: https://www.jobvetta.com/api
    baseURL: https://api.jobvetta.com/v1
    tags:
      - Jobs
      - Job Search
      - Recruitment
      - India
    properties:
      - type: Documentation
        url: https://www.jobvetta.com/api
      - type: SignUp
        url: https://www.jobvetta.com/dashboard
  - name: Jobvetta MCP Server
    description: >-
      Hosted MCP server over Streamable HTTP with two tools — `search_jobs` (q, location, days,
      limit) and `get_job` (job_id). Discovery is public: tools/list answers without credentials,
      so a client can enumerate the tools before holding a key. A key is needed only to run them,
      and the same key covers the REST API.
    humanURL: https://www.jobvetta.com/mcp
    baseURL: https://api.jobvetta.com/mcp
    tags:
      - MCP
      - Agent-native
      - Jobs
      - India
    properties:
      - type: MCPServer
        url: https://api.jobvetta.com/mcp
      - type: MCPTools
        url: mcp/jobvetta-mcp-tools.json
      - type: Documentation
        url: https://www.jobvetta.com/mcp
